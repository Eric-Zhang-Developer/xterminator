<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Xterminator — Block the For you feed</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #000000;
        --fg: #e7e9ea;
        --dim: #71767b;
        --dim2: #9ca0a4;
        --line: #2f3336;
        --line-soft: #1c1f23;
        --hover: #16181c;
        --col-w: 1320px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-size: 16px;
        line-height: 1.5;
        overflow-x: hidden;
      }

      body[data-type="serif"] h1,
      body[data-type="serif"] h2,
      body[data-type="serif"] .principles-word {
        font-family: "Instrument Serif", "Times New Roman", serif;
        font-weight: 400;
        letter-spacing: -0.015em;
      }
      body[data-type="serif"] h1,
      body[data-type="serif"] h2 {
        letter-spacing: -0.025em;
      }

      body[data-type="mono"] {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 14px;
      }
      body[data-type="mono"] h1,
      body[data-type="mono"] h2,
      body[data-type="mono"] .nav-mark,
      body[data-type="mono"] .btn-primary,
      body[data-type="mono"] .principles-word,
      body[data-type="mono"] .eyebrow {
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
      body[data-type="mono"] h1,
      body[data-type="mono"] h2 {
        letter-spacing: -0.04em;
      }

      ::selection {
        background: var(--fg);
        color: #000;
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      /* ── NAV (sticky) ────────────────────────────────── */
      nav.top {
        position: sticky;
        top: 0;
        z-index: 50;
        border-bottom: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(12px) saturate(180%);
        -webkit-backdrop-filter: blur(12px) saturate(180%);
      }
      .nav-inner {
        padding: 16px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        max-width: var(--col-w);
        margin: 0 auto;
      }
      .nav-left {
        display: flex;
        align-items: baseline;
        gap: 14px;
      }
      .nav-mark {
        font-weight: 800;
        font-size: 17px;
        letter-spacing: -0.02em;
      }
      .nav-mark .strike {
        position: relative;
        display: inline-block;
      }
      .nav-mark .strike::after {
        content: "";
        position: absolute;
        left: -2px;
        right: -2px;
        top: 52%;
        height: 2px;
        background: var(--fg);
        transform: rotate(-8deg);
      }
      .nav-meta {
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 26px;
      }
      .nav-link {
        color: var(--dim);
        font-size: 14px;
        transition: color 0.15s;
      }
      .nav-link:hover {
        color: var(--fg);
      }
      .nav-link.gh {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      /* ── FOLD (fills viewport) ───────────────────────── */
      .fold {
        min-height: calc(100vh - 57px);
        display: flex;
        flex-direction: column;
      }

      .stage {
        flex: 1;
        padding: 48px 32px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 520px);
        gap: 64px;
        align-items: center;
        max-width: var(--col-w);
        margin: 0 auto;
        width: 100%;
      }

      .hero-col {
        min-width: 0;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--dim);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin: 0 0 28px 0;
      }
      .eyebrow .dot {
        width: 6px;
        height: 6px;
        background: var(--fg);
        border-radius: 50%;
      }
      .eyebrow .rule {
        flex: 1;
        height: 1px;
        background: var(--line);
        max-width: 240px;
      }
      .eyebrow .num {
        font-variant-numeric: tabular-nums;
        color: var(--dim);
      }

      h1 {
        font-size: clamp(44px, 6.4vw, 84px);
        font-weight: 800;
        line-height: 0.98;
        letter-spacing: -0.04em;
        margin: 0 0 28px 0;
        text-wrap: balance;
      }
      h1 .kill {
        display: inline-block;
        position: relative;
      }
      h1 .kill::after {
        content: "";
        position: absolute;
        left: -0.04em;
        right: -0.04em;
        top: 52%;
        height: 0.08em;
        background: var(--fg);
        transform: scaleX(var(--kill, 0));
        transform-origin: left;
        transition: transform 1s cubic-bezier(0.6, 0, 0.2, 1) 0.25s;
      }
      body.lit h1 .kill::after {
        --kill: 1;
      }

      .sub {
        color: var(--dim2);
        font-size: clamp(15px, 1.3vw, 18px);
        line-height: 1.55;
        margin: 0 0 36px 0;
        max-width: 540px;
        text-wrap: pretty;
      }
      .sub code,
      .step-body code,
      .lede code {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.86em;
        color: var(--fg);
      }
      .step-body code {
        background: #16181c;
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 13px;
      }

      .cta-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 18px;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--fg);
        color: #000;
        font-weight: 700;
        font-size: 15px;
        padding: 14px 24px;
        border-radius: 9999px;
        transition:
          transform 0.12s,
          background 0.12s;
      }
      .btn-primary:hover {
        background: #fff;
        transform: translateY(-1px);
      }
      .meta {
        color: var(--dim);
        font-size: 13px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        letter-spacing: 0.02em;
      }
      .meta .sep {
        opacity: 0.5;
        margin: 0 8px;
      }

      /* DEMO */
      .demo-col {
        min-width: 0;
      }
      .demo-wrap {
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        background: #050505;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.6),
          0 2px 0 rgba(255, 255, 255, 0.02) inset;
      }
      .demo-chrome {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: #08090a;
      }
      .dot-light {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #2f3336;
      }
      .demo-url {
        margin-left: 6px;
        background: #16181c;
        color: var(--dim2);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 6px;
        flex: 1;
        max-width: 220px;
      }
      .demo-toggle-host {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .demo-toggle-host span {
        font-size: 10px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
      .switch {
        position: relative;
        width: 36px;
        height: 20px;
        background: #2f3336;
        border-radius: 9999px;
        cursor: pointer;
        transition: background 0.2s;
        border: none;
        padding: 0;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 14px;
        height: 14px;
        background: var(--fg);
        border-radius: 50%;
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .switch.on {
        background: var(--fg);
      }
      .switch.on::after {
        transform: translateX(16px);
        background: #000;
      }

      .demo-body {
        position: relative;
        padding: 16px;
        display: grid;
        grid-template-columns: 38px 1fr 80px;
        gap: 12px;
        height: 260px;
      }
      .demo-sidebar {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .demo-sidebar .si {
        height: 6px;
        background: var(--line);
        border-radius: 3px;
      }
      .demo-sidebar .si:first-child {
        background: var(--fg);
      }
      .demo-rail {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .demo-rail .ri {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .demo-rail .rl {
        height: 5px;
        background: var(--line);
        border-radius: 2px;
      }
      .demo-rail .rl.short {
        width: 60%;
      }

      .demo-feed {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
        transition:
          border-color 0.3s,
          border-style 0.3s;
      }
      .feed-tabs {
        display: flex;
        gap: 18px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
        transition: opacity 0.3s;
      }
      .feed-tabs .tab {
        height: 5px;
        width: 44px;
        background: var(--line);
        border-radius: 3px;
      }
      .feed-tabs .tab.active {
        background: var(--fg);
      }
      .post {
        display: flex;
        gap: 10px;
        padding: 2px 0;
        transition:
          opacity 0.35s,
          transform 0.35s;
      }
      .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--line);
        flex-shrink: 0;
      }
      .post-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding-top: 3px;
      }
      .line {
        height: 5px;
        background: var(--line);
        border-radius: 2px;
      }
      .line.w90 {
        width: 90%;
      }
      .line.w70 {
        width: 70%;
      }
      .line.w50 {
        width: 50%;
      }

      .demo-feed.terminated {
        border-style: dashed;
      }
      .demo-feed.terminated .feed-tabs {
        opacity: 0.25;
      }
      .demo-feed.terminated .post {
        opacity: 0;
        transform: translateX(-8px);
        pointer-events: none;
      }
      .demo-feed.terminated .post:nth-child(2) {
        transition-delay: 0.04s;
      }
      .demo-feed.terminated .post:nth-child(3) {
        transition-delay: 0.08s;
      }
      .demo-feed.terminated .post:nth-child(4) {
        transition-delay: 0.12s;
      }

      .terminated-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s 0.2s;
      }
      .demo-feed.terminated .terminated-overlay {
        opacity: 1;
      }
      .terminated-overlay .tag {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.05em;
        color: var(--dim);
        border: 1px solid var(--line);
        background: #050505;
        padding: 5px 10px;
        border-radius: 5px;
      }
      .terminated-overlay .tag b {
        color: var(--fg);
        font-weight: 500;
      }

      .demo-caption {
        padding: 10px 14px;
        color: var(--dim);
        font-size: 11px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        letter-spacing: 0.02em;
        border-top: 1px solid var(--line-soft);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }
      .demo-caption .arrow {
        color: var(--fg);
      }

      /* PRINCIPLES STRIP (fold bottom) */
      .strip {
        border-top: 1px solid var(--line);
        background: #000;
      }
      .strip-inner {
        max-width: var(--col-w);
        margin: 0 auto;
        padding: 26px 32px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 48px;
      }
      .strip-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .strip-item .label {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 10px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.16em;
      }
      .principles-word {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.015em;
        color: var(--fg);
      }
      .strip-item .body {
        color: var(--dim2);
        font-size: 14px;
        line-height: 1.5;
        text-wrap: pretty;
      }

      /* ── BELOW THE FOLD ──────────────────────────────── */
      .scroll-region {
        border-top: 1px solid var(--line);
      }
      .below-col {
        max-width: 920px;
        margin: 0 auto;
        padding-inline: 32px;
      }
      section.block {
        padding-block: 96px;
      }
      section.block + section.block {
        border-top: 1px solid var(--line-soft);
      }

      h2 {
        font-size: clamp(28px, 3.6vw, 44px);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.05;
        margin: 0 0 28px 0;
        text-wrap: balance;
      }
      .section-eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--dim);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin: 0 0 20px 0;
      }
      .section-eyebrow .num {
        font-variant-numeric: tabular-nums;
      }
      .section-eyebrow .rule {
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      .lede {
        color: var(--fg);
        font-size: 18px;
        line-height: 1.55;
        margin: 0 0 28px 0;
        max-width: 680px;
        text-wrap: pretty;
      }
      .lede.dim {
        color: var(--dim2);
      }

      /* CODE BLOCK */
      .code-block {
        background: #050505;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 22px 24px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 13px;
        line-height: 1.7;
        color: var(--dim2);
        overflow-x: auto;
        margin: 24px 0 18px;
        max-width: 760px;
      }
      .code-block .kw {
        color: var(--fg);
        font-weight: 500;
      }
      .code-block .com {
        color: #555a5e;
      }
      .code-block .str {
        color: #c9ced2;
      }
      .code-block .num {
        color: var(--dim);
        display: inline-block;
        width: 28px;
        user-select: none;
        opacity: 0.4;
        font-variant-numeric: tabular-nums;
      }

      /* INSTALL STEPS */
      .step {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        gap: 20px;
        padding: 20px 0;
        border-top: 1px solid var(--line-soft);
        align-items: baseline;
        max-width: 760px;
      }
      .step:last-child {
        border-bottom: 1px solid var(--line-soft);
      }
      .step-n {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        color: var(--dim);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .step-body {
        color: var(--fg);
        font-size: 16px;
        line-height: 1.5;
      }
      .step-body .hint {
        display: block;
        color: var(--dim);
        font-size: 13px;
        margin-top: 6px;
      }
      .step-tag {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 10px;
        color: var(--dim);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      /* CLOSER */
      .closer {
        text-align: left;
      }
      .closer h2 {
        margin-bottom: 32px;
      }

      /* FOOTER */
      footer {
        border-top: 1px solid var(--line);
      }
      .footer-inner {
        max-width: var(--col-w);
        margin: 0 auto;
        padding: 22px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--dim);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        letter-spacing: 0.02em;
      }
      .footer-inner .fl-mid {
        flex: 1;
        text-align: center;
        color: var(--dim);
      }
      .footer-inner a:hover {
        color: var(--fg);
      }

      /* SCROLL HINT */
      .scroll-hint {
        position: absolute;
        bottom: 130px;
        left: 50%;
        transform: translateX(-50%);
        color: var(--dim);
        font-size: 10px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        opacity: 0;
        transition: opacity 0.8s 1.2s;
        pointer-events: none;
      }
      body.lit .scroll-hint {
        opacity: 0.7;
      }
      .scroll-hint .tick {
        width: 1px;
        height: 22px;
        background: linear-gradient(to bottom, transparent, var(--dim));
        animation: scroll-tick 2s infinite;
      }
      @keyframes scroll-tick {
        0% {
          transform: translateY(-6px);
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
        100% {
          transform: translateY(6px);
          opacity: 0;
        }
      }

      /* ── RESPONSIVE ──────────────────────────────────── */
      @media (max-width: 980px) {
        .stage {
          grid-template-columns: 1fr;
          gap: 40px;
          padding: 36px 24px;
        }
        .demo-col {
          max-width: 520px;
        }
        .strip-inner {
          grid-template-columns: 1fr;
          gap: 20px;
          padding: 22px 24px;
        }
        .nav-inner {
          padding: 14px 20px;
        }
        .nav-right .nav-link:not(.gh) {
          display: none;
        }
        .footer-inner {
          padding: 16px 20px;
          font-size: 11px;
        }
        .below-col {
          padding-inline: 24px;
        }
        section.block {
          padding-block: 64px;
        }
        .scroll-hint {
          display: none;
        }
      }
      @media (max-width: 540px) {
        .demo-body {
          grid-template-columns: 28px 1fr;
          height: 220px;
        }
        .demo-rail {
          display: none;
        }
        .demo-url {
          max-width: 140px;
        }
        .step {
          grid-template-columns: 28px 1fr;
        }
        .step-tag {
          display: none;
        }
      }
    </style>
  </head>
  <body data-type="sans">
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      crossorigin="anonymous"
    ></script>

    <script type="text/babel" src="single-screen-plus.jsx"></script>
  </body>
</html>
